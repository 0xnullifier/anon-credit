[package]
name = "poseidon2_vectors"
type = "lib"
authors = []

[dependencies]
# The Noir team moved the public Poseidon2 sponge out of the standard library into this
# package. v0.4.0 compiles with Noir 1.0.0-beta.26. Its sponge uses the same absorb order and
# the same number of permutations as v0.2.0; the vectors did not change.
poseidon = { tag = "v0.4.0", git = "https://github.com/noir-lang/poseidon" }
