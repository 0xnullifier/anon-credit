[package]
name = "anon-credit-gateway"
description = "Open, spend, recovery, upstream calls, events, and admin HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anon-credit-crypto.workspace = true
anon-credit-protocol.workspace = true
alloy.workspace = true
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Versions local to this crate. Cargo.lock already has each of them.
async-trait = "0.1.92"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
sha2 = "0.10.9"
tower-http = { version = "0.6.11", default-features = false, features = ["cors"] }

[dev-dependencies]
ed25519-dalek.workspace = true
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", default-features = false, features = ["util"] }

[[bin]]
name = "gateway"
path = "src/main.rs"
