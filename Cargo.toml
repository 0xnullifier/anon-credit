[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/crypto",
    "crates/registry",
    "crates/issuer",
    "crates/gateway",
]
# The ProveKit verifier adapter needs the nightly toolchain that ProveKit pins.
# It is a separate workspace with its own rust-toolchain.toml and Cargo.lock.
exclude = ["crates/prover"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

# Shared dependency versions. Cargo.lock pins the exact resolved set.
[workspace.dependencies]
# Internal crates
anon-credit-protocol = { path = "crates/protocol" }
anon-credit-crypto = { path = "crates/crypto" }
anon-credit-registry = { path = "crates/registry" }

# Service stack
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
alloy = { version = "2.5.0", default-features = false, features = ["std", "contract", "provider-http", "rpc-types", "sol-types", "reqwest-rustls-tls"] }
toml = "1.2.1"

# Errors
thiserror = "2.0.21"
anyhow = "1.0.104"

# Cryptography and encoding
ed25519-dalek = "3.0.0"
sha3 = "0.12.0"
hex = "0.4.3"
base64 = "0.22.1"
rand = "0.10.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
